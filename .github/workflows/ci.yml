name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Throwaway values for CI only — never real secrets.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      PAYLOAD_SECRET: ci-payload-secret-0123456789abcdef0123
      SERVER_URL: http://localhost:3001
      FRONTEND_URL: http://localhost:3000
      REVALIDATE_SECRET: ci-revalidate-secret-0123456789abcdef
      CONTACT_API_KEY: ci-contact-api-key-0123456789abcdef01
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
